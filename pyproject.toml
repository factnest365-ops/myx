[project]
name = "myx"
version = "0.2.0"
description = "Terminal music player for YouTube/YT Music radio — agent-native (MCP) + TUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
myx = "myx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
