name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify packaging & Homebrew formula metadata
        run: |
          python3 scripts/bump_release.py --verify
          if command -v ruby >/dev/null 2>&1; then
            ruby -c Formula/myx.rb
          fi
          bash -n scripts/install.sh

      - name: Sync environment from uv.lock & run test suite
        run: |
          uv sync --extra dev
          uv run pytest -q

      - name: Build wheel & sdist and smoke-test CLI install
        run: |
          uv build
          ls -lh dist/
          uv venv /tmp/myx-wheel-smoke
          uv pip install --python /tmp/myx-wheel-smoke/bin/python dist/*.whl
          /tmp/myx-wheel-smoke/bin/myx --version
          /tmp/myx-wheel-smoke/bin/myx update --check
